name: Deploy FDS API to OpenShift

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fds-openshift-production
  cancel-in-progress: false

env:
  OPENSHIFT_NAMESPACE: fds
  IMAGE_NAME: financial-fds-api

jobs:
  test-build-push-deploy:
    name: Test, push image, and deploy
    runs-on: ubuntu-latest
    environment: openshift-production

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies and run tests
        working-directory: app
        run: |
          pnpm install --frozen-lockfile
          pnpm test

      - name: Set image tags
        run: |
          echo "IMAGE_URI=${{ secrets.QUAY_REGISTRY }}/${{ secrets.QUAY_NAMESPACE }}/${IMAGE_NAME}" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Log in to Quay Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.QUAY_REGISTRY }}
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Build and push immutable application image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_URI }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_URI }}:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Log in to OpenShift
        uses: redhat-actions/oc-login@v1
        with:
          openshift_server_url: ${{ secrets.OPENSHIFT_SERVER }}
          openshift_token: ${{ secrets.OPENSHIFT_TOKEN }}

      - name: Apply configuration, image pull Secret, and database Secret
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          QUAY_REGISTRY: ${{ secrets.QUAY_REGISTRY }}
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
        run: |
          oc get namespace "${OPENSHIFT_NAMESPACE}" >/dev/null
          oc project "${OPENSHIFT_NAMESPACE}"
          oc create secret docker-registry quay-pull-secret \
            --docker-server="${QUAY_REGISTRY}" \
            --docker-username="${QUAY_USERNAME}" \
            --docker-password="${QUAY_PASSWORD}" \
            --namespace="${OPENSHIFT_NAMESPACE}" \
            --dry-run=client -o yaml | oc apply -f -
          oc secrets link default quay-pull-secret --for=pull --namespace="${OPENSHIFT_NAMESPACE}" || true
          oc apply -f openshift/config.yaml
          oc create secret generic fds-api-secret \
            --from-literal=DATABASE_URL="${DATABASE_URL}" \
            --namespace="${OPENSHIFT_NAMESPACE}" \
            --dry-run=client -o yaml | oc apply -f -

      - name: Deploy immutable image and wait for rollout
        run: |
          sed "s#quay.io/REPLACE_ME/financial-fds-api:1.0.0#${IMAGE_URI}:${IMAGE_TAG}#g" \
            openshift/deployment.yaml | oc apply -f -
          oc apply -f openshift/service-route.yaml
          oc rollout status deployment/fds-api --namespace="${OPENSHIFT_NAMESPACE}" --timeout=180s
          oc get route fds-api --namespace="${OPENSHIFT_NAMESPACE}"

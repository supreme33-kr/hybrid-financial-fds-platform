---
- name: Disable swap for Kubernetes
  ansible.builtin.command: swapoff -a
  changed_when: false

- name: Disable swap persistently in fstab
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^(?!#)(.+\s+swap\s+.+)$'
    replace: '# \1'

- name: Load Kubernetes required kernel modules
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k8s.conf
    mode: "0644"
    content: |
      overlay
      br_netfilter

- name: Activate Kubernetes required kernel modules
  ansible.builtin.shell: |
    modprobe overlay
    modprobe br_netfilter
  changed_when: false

- name: Configure Kubernetes kernel networking parameters
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-kubernetes-cri.conf
    mode: "0644"
    content: |
      net.bridge.bridge-nf-call-iptables = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward = 1

- name: Reload kernel networking parameters
  ansible.builtin.command: sysctl --system
  changed_when: false

- name: Configure Kubernetes v1.35 package repository
  ansible.builtin.yum_repository:
    name: kubernetes
    description: Kubernetes v1.35 RPM repository
    baseurl: https://pkgs.k8s.io/core:/stable:/v1.35/rpm/
    enabled: true
    gpgcheck: true
    gpgkey: https://pkgs.k8s.io/core:/stable:/v1.35/rpm/repodata/repomd.xml.key

- name: Install kubelet kubeadm and kubectl
  ansible.builtin.dnf:
    name:
      - kubelet
      - kubeadm
      - kubectl
    state: present
    disable_excludes: kubernetes

- name: Ensure kubelet service is enabled
  ansible.builtin.systemd:
    name: kubelet
    enabled: true
    state: started

apiVersion: apps/v1
kind: Deployment
metadata:
  name: fds-api
  namespace: fds
  labels:
    app.kubernetes.io/name: fds-api
    app.kubernetes.io/part-of: financial-fds-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: fds-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fds-api
        app.kubernetes.io/part-of: financial-fds-platform
    spec:
      containers:
        - name: fds-api
          image: quay.io/REPLACE_ME/financial-fds-api:1.0.0
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: fds-api-config
            - secretRef:
                name: fds-api-secret
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20

name: FDS API CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test Fastify API and build image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Enable Corepack
        run: corepack enable

      - name: Install application dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Run Fastify unit tests
        working-directory: app
        run: pnpm test

      - name: Build OpenShift-compatible container image
        run: docker build --file docker/Dockerfile --tag financial-fds-api:ci .
